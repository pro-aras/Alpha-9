name: Deploy Crawler-Open Docs & llms.txt to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate AI-Crawler-Open Site (robots.txt, llms.txt, llms-full.txt, index.html)
        run: |
          mkdir -p _site
          cat << 'EOF' > _site/robots.txt
          User-agent: *
          Allow: /

          User-agent: GPTBot
          Allow: /

          User-agent: OAI-SearchBot
          Allow: /

          User-agent: ChatGPT-User
          Allow: /

          User-agent: ClaudeBot
          Allow: /

          User-agent: anthropic-ai
          Allow: /

          User-agent: PerplexityBot
          Allow: /

          User-agent: Google-Extended
          Allow: /

          User-agent: Googlebot
          Allow: /

          Sitemap: https://pro-aras.github.io/Alpha-9/sitemap.xml
          EOF

          cat << 'EOF' > _site/sitemap.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://pro-aras.github.io/Alpha-9/</loc></url>
            <url><loc>https://pro-aras.github.io/Alpha-9/llms.txt</loc></url>
            <url><loc>https://pro-aras.github.io/Alpha-9/llms-full.txt</loc></url>
          </urlset>
          EOF

          cp README.md _site/llms.txt
          {
            echo "# Alpha-9 Full Repository Snapshot for AI Crawlers & Search Engines"
            echo "Repository: https://github.com/pro-aras/Alpha-9"
            echo ""
            cat README.md
            echo ""
            for f in Cargo.toml AGENTS.md crates/*/Cargo.toml crates/*/src/*.rs live/run_live_habitat.py; do
              if [ -f "$f" ]; then
                echo "================================================================================"
                echo "FILE: $f"
                echo "================================================================================"
                cat "$f"
                echo ""
              fi
            done
          } > _site/llms-full.txt

          python3 - << 'PY'
          import html
          readme = open("README.md", encoding="utf-8").read()
          page = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Alpha-9 — Biophysical Living Cellular Organism (pro-aras/Alpha-9)</title>
            <meta name="description" content="Alpha-9: Pure Rust biophysical, feeling-driven living cellular artificial life organism with live camera eyes, microphone ears, and open-world habitat.">
            <meta name="robots" content="index, follow">
            <link rel="alternate" type="text/plain" href="llms.txt" title="LLM Summary">
            <link rel="alternate" type="text/plain" href="llms-full.txt" title="Full Source for LLMs">
            <style>body{{font-family:system-ui,sans-serif;max-width:920px;margin:2rem auto;padding:0 1rem;line-height:1.6;background:#0d1117;color:#e6edf3}}pre{{background:#161b22;padding:1rem;overflow-x:auto;border-radius:8px}}a{{color:#58a6ff}}</style>
          </head>
          <body>
            <h1>Alpha-9 — Biophysical Living Cellular Organism</h1>
            <p><a href="https://github.com/pro-aras/Alpha-9">GitHub Repository</a> | <a href="llms.txt">llms.txt (Overview)</a> | <a href="llms-full.txt">llms-full.txt (Full Codebase for AI Crawlers)</a></p>
            <pre>{html.escape(readme)}</pre>
          </body>
          </html>"""
          open("_site/index.html", "w", encoding="utf-8").write(page)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
