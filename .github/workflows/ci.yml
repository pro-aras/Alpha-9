name: Alpha-9 Rust CI & Integrity Gates

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build workspace and C-ABI shared library
        run: cargo build --release --workspace

      - name: Run 17 biophysical integrity & zero-string gates
        run: cargo run --release -p alpha-exams
